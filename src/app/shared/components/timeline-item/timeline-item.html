<div class="relative">
  <div
    class="absolute -left-[1.875rem] top-4 w-3 h-3 rounded-full bg-blue-500 ring-2 ring-white dark:ring-gray-950 z-10"
  ></div>
  <div
    class="rounded-xl border bg-white border-gray-200 dark:bg-gray-900 dark:border-gray-700 p-4 shadow-sm"
  >
    <div class="flex items-start justify-between gap-4">
      <div>
        <h3 class="font-semibold text-lg">{{ experience().role }}</h3>
        <p class="text-gray-600 dark:text-gray-400">{{ experience().company }}</p>
      </div>
      <div class="flex flex-col items-end gap-1 shrink-0">
        <span class="text-sm text-gray-500 dark:text-gray-400">{{ experience().period }}</span>
        <span
          class="text-xs px-2 py-0.5 rounded-full"
          [class]="
            experience().type === 'academic'
              ? 'bg-purple-100 text-purple-700 dark:bg-purple-900 dark:text-purple-300'
              : 'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300'
          "
        >
          {{ i18n.t('experience.type.' + experience().type) }}
        </span>
      </div>
    </div>
    <p class="mt-2 text-gray-600 dark:text-gray-400 text-sm leading-relaxed">
      {{ experience().description }}
    </p>
  </div>
</div>
