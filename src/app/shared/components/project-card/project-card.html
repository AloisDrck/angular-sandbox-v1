<article class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-5 hover:shadow-md transition-shadow flex flex-col gap-3">
  <div class="flex items-start justify-between">
    <h3 class="font-semibold text-lg">
      <a [routerLink]="['/projects', project().slug]" class="hover:text-blue-600 dark:hover:text-blue-400">
        {{ project().title }}
      </a>
    </h3>
    <span class="text-sm text-gray-500">{{ project().year }}</span>
  </div>

  <p class="text-gray-600 dark:text-gray-400 text-sm leading-relaxed">{{ project().description }}</p>

  <div class="flex flex-wrap gap-2 mt-auto">
    @for (tech of project().techs; track tech) {
      <span class="text-xs px-2 py-0.5 bg-gray-100 dark:bg-gray-800 rounded-full text-gray-700 dark:text-gray-300">
        {{ tech }}
      </span>
    }
  </div>

  <a [href]="project().repoGit" target="_blank" rel="noopener"
     class="text-sm text-blue-600 hover:underline dark:text-blue-400 self-start">
    {{ i18n.t('projects.viewProject') }}
  </a>
</article>
