<div class="fixed inset-0 top-14 z-10">
  <!-- Pixel art canvas (scaled pixelated) -->
  <canvas
    #scene
    [attr.width]="480"
    [attr.height]="300"
    class="w-full h-full block"
    style="image-rendering: pixelated; image-rendering: crisp-edges"
  ></canvas>
  <!-- Crisp text overlay (native DPI, no pixelation) -->
  <canvas #textLayer class="absolute inset-0 w-full h-full pointer-events-none"></canvas>

  @if (engine.bubbleScale() > 0.05 && engine.nearbyRefuge()) {
    <button
      (click)="enterRefuge()"
      class="absolute bottom-6 left-1/2 -translate-x-1/2 px-4 py-2 bg-indigo-600 text-white text-sm rounded-lg hover:bg-indigo-500 transition"
    >
      Entrer dans le refuge
    </button>
  }
</div>
